<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Tali Lanyard Sublimasi - Faeyza Digital Printing Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf9f0"/>
      <stop offset="0.55" stop-color="#f8f2e6"/>
      <stop offset="1" stop-color="#f3ebdc"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe5d3" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8dcc7" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#8a6a52" flood-opacity="0.16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2b2723" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect y="640" width="1200" height="260" fill="url(#floor)"/>
  <circle cx="1032" cy="112" r="236" fill="#c6edcf" opacity="0.42"/>
  <circle cx="1064" cy="146" r="304" fill="none" stroke="#2b2723" stroke-width="1.6" opacity="0.1"/>
  <circle cx="84" cy="824" r="228" fill="#fbe38d" opacity="0.34"/>
  <rect x="36" y="40" width="220" height="130" fill="url(#dots)"/>

  
  <ellipse cx="600" cy="712" rx="300" ry="30" fill="#8a6a52" opacity="0.16"/>
  <g transform="translate(600 452) rotate(4)">
    <path d="M-180 -320 C -300 -230 -300 -40 -180 20 C -60 80 60 80 180 20 C 300 -40 300 -230 180 -320" fill="none" stroke="#43664e" stroke-width="38" stroke-linecap="round"/>
    <path d="M-180 -320 C -300 -230 -300 -40 -180 20 C -60 80 60 80 180 20 C 300 -40 300 -230 180 -320" fill="none" stroke="#fffdf7" stroke-width="2" stroke-dasharray="4 10" opacity="0.45"/>
    <text x="0" y="-284" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="15" font-weight="800" fill="#fffdf7" text-anchor="middle" letter-spacing="5">FAEYZA STUDIO</text>
    <text x="0" y="-80" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="12" font-weight="800" fill="#fffdf7" text-anchor="middle" letter-spacing="3">EVENT CREW - 2026</text>
    <rect x="-34" y="10" width="68" height="46" rx="10" fill="#2b2723"/>
    <rect x="-22" y="34" width="44" height="18" rx="6" fill="#c6edcf"/>
    <circle cx="0" cy="104" r="16" fill="#2b2723"/>
    <g filter="url(#soft)" transform="translate(0 180)">
      <rect x="-190" y="-14" width="380" height="250" rx="14" fill="#fffdf7" stroke="#2b2723" stroke-width="3"/>
      <rect x="-190" y="-14" width="380" height="58" rx="14" fill="#b2dfee"/>
      <rect x="-190" y="20" width="380" height="24" fill="#b2dfee"/>
      <text x="0" y="24" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="15" font-weight="800" fill="#2b2723" text-anchor="middle" letter-spacing="3">LANYARD SUBLIMASI</text>
      <text x="0" y="80" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="12" font-weight="700" fill="#43664e" text-anchor="middle" letter-spacing="2">FULL COLOR 2 SISI - LEBAR 2 CM</text>
      <rect x="-150" y="112" width="245.99999999999997" height="5" rx="2.5" fill="#2b2723" opacity="0.35"/><rect x="-150" y="136" width="285" height="5" rx="2.5" fill="#2b2723" opacity="0.35"/><rect x="-150" y="160" width="186" height="5" rx="2.5" fill="#2b2723" opacity="0.35"/>
      <text x="0" y="206" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="700" fill="#8f8675" text-anchor="middle" letter-spacing="2">KAIT BESI + STOPPER</text>
    </g>
  </g>

  <rect width="1200" height="900" filter="url(#grain)" opacity="0.7"/>

  <g>
    <rect x="64" y="826" width="42" height="3" rx="1.5" fill="#2b2723"/>
    <text x="64" y="856" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="14" font-weight="800" fill="#2b2723" letter-spacing="3">FAEYZA STUDIO</text>
    <text x="64" y="876" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#7d7566" letter-spacing="2.4">DIGITAL PRINTING - BANDUNG</text>
  </g>
  <g text-anchor="end">
    <text x="1136" y="846" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="800" fill="#7d7566" letter-spacing="2.4">TALI LANYARD SUBLIMASI</text>
    <text x="1136" y="868" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#9a9283" letter-spacing="2">SERI 02</text>
  </g>
</svg>
