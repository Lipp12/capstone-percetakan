<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Poster Dinding Art Carton - Faeyza Digital Printing Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf9f0"/>
      <stop offset="0.55" stop-color="#f8f2e6"/>
      <stop offset="1" stop-color="#f3ebdc"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe5d3" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8dcc7" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#8a6a52" flood-opacity="0.16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2b2723" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect y="640" width="1200" height="260" fill="url(#floor)"/>
  <circle cx="1032" cy="112" r="236" fill="#fbe38d" opacity="0.42"/>
  <circle cx="1064" cy="146" r="304" fill="none" stroke="#2b2723" stroke-width="1.6" opacity="0.1"/>
  <circle cx="84" cy="824" r="228" fill="#c6edcf" opacity="0.34"/>
  <rect x="36" y="40" width="220" height="130" fill="url(#dots)"/>

  
  <ellipse cx="600" cy="728" rx="330" ry="28" fill="#8a6a52" opacity="0.16"/>
  <g transform="translate(600 446) rotate(-3)">
    <rect x="-300" y="-320" width="330" height="610" rx="6" fill="#fffdf7" stroke="#2b2723" stroke-width="3" transform="translate(-58 22) rotate(-4)" filter="url(#soft)"/>
    <rect x="-274" y="-294" width="278" height="558" fill="#fed9e1" opacity="0.55"/>
    <g>
      <rect x="-228" y="-300" width="460" height="630" rx="6" fill="#b5854f" stroke="#2b2723" stroke-width="3"/>
      <rect x="-204" y="-276" width="412" height="582" fill="#fffdf7" stroke="#2b2723" stroke-width="2"/>
      <rect x="-182" y="-254" width="368" height="420" fill="#c6edcf" opacity="0.55"/>
      <circle cx="2" cy="-112" r="104" fill="#fbe38d" stroke="#2b2723" stroke-width="2.5"/>
      <path d="M-50 -60 Q 2 -190 54 -60" fill="none" stroke="#6e5d15" stroke-width="8" stroke-linecap="round"/>
      <path d="M2 90 C 22.8 34, -12.4 -14, 8.4 -78" fill="none" stroke="#6e5d15" stroke-width="3" stroke-linecap="round" opacity="0.75"/><ellipse cx="21.200000000000003" cy="62.8" rx="10.4" ry="20.8" fill="#6e5d15" opacity="0.24" transform="rotate(28 21.200000000000003 62.8)"/><ellipse cx="-17.200000000000003" cy="32.39999999999999" rx="10.4" ry="20.8" fill="#6e5d15" opacity="0.24" transform="rotate(-28 -17.200000000000003 32.39999999999999)"/><ellipse cx="21.200000000000003" cy="1.999999999999993" rx="10.4" ry="20.8" fill="#6e5d15" opacity="0.24" transform="rotate(28 21.200000000000003 1.999999999999993)"/><ellipse cx="-17.200000000000003" cy="-28.400000000000006" rx="10.4" ry="20.8" fill="#6e5d15" opacity="0.24" transform="rotate(-28 -17.200000000000003 -28.400000000000006)"/><ellipse cx="21.200000000000003" cy="-58.80000000000001" rx="10.4" ry="20.8" fill="#6e5d15" opacity="0.24" transform="rotate(28 21.200000000000003 -58.80000000000001)"/>
      <text x="2" y="214" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="24" font-weight="800" fill="#2b2723" text-anchor="middle" letter-spacing="4">POSTER</text>
      <text x="2" y="244" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="700" fill="#6d6556" text-anchor="middle" letter-spacing="2">ART CARTON - A2</text>
    </g>
  </g>

  <rect width="1200" height="900" filter="url(#grain)" opacity="0.7"/>

  <g>
    <rect x="64" y="826" width="42" height="3" rx="1.5" fill="#2b2723"/>
    <text x="64" y="856" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="14" font-weight="800" fill="#2b2723" letter-spacing="3">FAEYZA STUDIO</text>
    <text x="64" y="876" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#7d7566" letter-spacing="2.4">DIGITAL PRINTING - BANDUNG</text>
  </g>
  <g text-anchor="end">
    <text x="1136" y="846" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="800" fill="#7d7566" letter-spacing="2.4">POSTER DINDING ART CARTON</text>
    <text x="1136" y="868" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#9a9283" letter-spacing="2">SERI 01</text>
  </g>
</svg>
