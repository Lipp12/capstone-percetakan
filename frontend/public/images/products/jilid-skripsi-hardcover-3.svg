<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Jilid Skripsi Hardcover - Faeyza Digital Printing Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf9f0"/>
      <stop offset="0.55" stop-color="#f8f2e6"/>
      <stop offset="1" stop-color="#f3ebdc"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe5d3" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8dcc7" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#8a6a52" flood-opacity="0.16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2b2723" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect y="640" width="1200" height="260" fill="url(#floor)"/>
  <circle cx="1032" cy="112" r="236" fill="#fed9e1" opacity="0.42"/>
  <circle cx="1064" cy="146" r="304" fill="none" stroke="#2b2723" stroke-width="1.6" opacity="0.1"/>
  <circle cx="84" cy="824" r="228" fill="#b2dfee" opacity="0.34"/>
  <rect x="36" y="40" width="220" height="130" fill="url(#dots)"/>

  
  <ellipse cx="600" cy="720" rx="330" ry="30" fill="#8a6a52" opacity="0.18"/>
  <g transform="translate(600 452) rotate(-1)">
    <rect x="-252" y="-300" width="492" height="588" rx="6" fill="#efe7d8" stroke="#2b2723" stroke-width="2" transform="translate(30 22) rotate(3)"/>
    <g filter="url(#soft)">
      <rect x="-256" y="-306" width="500" height="600" rx="7" fill="#72575e" stroke="#2b2723" stroke-width="3"/>
      <rect x="-230" y="-280" width="448" height="548" rx="3" fill="none" stroke="#d8b25f" stroke-width="1.6" opacity="0.9"/>
      <rect x="-206" y="-256" width="400" height="500" rx="2" fill="none" stroke="#d8b25f" stroke-width="1" opacity="0.5"/>
      <text x="0" y="-136" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="13" font-weight="800" fill="#d8b25f" text-anchor="middle" letter-spacing="5">TUGAS AKHIR</text>
      <text x="0" y="-68"  font-size="42" font-weight="700" fill="#f4ead7" text-anchor="middle" font-family="Georgia,serif">Skripsi</text>
      <path d="M-150 6 Q 0 -34 150 6" fill="none" stroke="#d8b25f" stroke-width="1.6" opacity="0.8"/>
      <text x="0" y="48"  font-size="26" font-weight="500" fill="#f4ead7" text-anchor="middle" font-family="Georgia,serif" font-style="italic">Nadia Prameswari</text>
      <text x="0" y="92" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="12" font-weight="700" fill="#d8b25f" text-anchor="middle" letter-spacing="3">PROGRAM STUDI - FAKULTAS</text>
      <circle cx="0" cy="168" r="52" fill="none" stroke="#d8b25f" stroke-width="2"/>
      <text x="0" y="182"  font-size="34" font-weight="700" fill="#d8b25f" text-anchor="middle" font-family="Georgia,serif">F</text>
      <text x="0" y="244" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="700" fill="#d8b25f" text-anchor="middle" letter-spacing="2">FAEYZA DIGITAL PRINTING - 2026</text>
      <rect x="-256" y="270" width="500" height="10" fill="#d8b25f" opacity="0.8"/>
    </g>
  </g>

  <rect width="1200" height="900" filter="url(#grain)" opacity="0.7"/>

  <g>
    <rect x="64" y="826" width="42" height="3" rx="1.5" fill="#2b2723"/>
    <text x="64" y="856" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="14" font-weight="800" fill="#2b2723" letter-spacing="3">FAEYZA STUDIO</text>
    <text x="64" y="876" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#7d7566" letter-spacing="2.4">DIGITAL PRINTING - BANDUNG</text>
  </g>
  <g text-anchor="end">
    <text x="1136" y="846" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="800" fill="#7d7566" letter-spacing="2.4">JILID SKRIPSI HARDCOVER</text>
    <text x="1136" y="868" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#9a9283" letter-spacing="2">SERI 03</text>
  </g>
</svg>
