<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Buku dan Novel Softcover - Faeyza Digital Printing Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf9f0"/>
      <stop offset="0.55" stop-color="#f8f2e6"/>
      <stop offset="1" stop-color="#f3ebdc"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe5d3" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8dcc7" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#8a6a52" flood-opacity="0.16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2b2723" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect y="640" width="1200" height="260" fill="url(#floor)"/>
  <circle cx="1032" cy="112" r="236" fill="#c6edcf" opacity="0.42"/>
  <circle cx="1064" cy="146" r="304" fill="none" stroke="#2b2723" stroke-width="1.6" opacity="0.1"/>
  <circle cx="84" cy="824" r="228" fill="#fbe38d" opacity="0.34"/>
  <rect x="36" y="40" width="220" height="130" fill="url(#dots)"/>

  
  <ellipse cx="600" cy="726" rx="330" ry="30" fill="#8a6a52" opacity="0.16"/>
  <g transform="translate(600 452) rotate(4)">
    <rect x="-240" y="-300" width="460" height="584" rx="6" fill="#e9dfcd" stroke="#2b2723" stroke-width="2" transform="translate(40 26) rotate(5)"/>
    <rect x="-240" y="-300" width="460" height="584" rx="6" fill="#f4ede0" stroke="#2b2723" stroke-width="2" transform="translate(20 13) rotate(2.5)"/>
    <g filter="url(#soft)">
      <rect x="-244" y="-306" width="470" height="596" rx="7" fill="#43664e" stroke="#2b2723" stroke-width="3"/>
      <rect x="-244" y="-306" width="34" height="596" rx="7" fill="#2b2723" opacity="0.35"/>
      <rect x="-244" y="-306" width="470" height="596" rx="7" fill="#c6edcf" opacity="0.16"/>
      <text x="0" y="-150" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="13" font-weight="800" fill="#c6edcf" text-anchor="middle" letter-spacing="4">SEBUAH ANTOLOGI</text>
      <text x="0" y="-62" font-family="Georgia,serif" font-size="58" font-weight="400" fill="#fffdf7" text-anchor="middle">Ruang</text>
      <text x="0" y="12" font-family="Georgia,serif" font-size="58" font-weight="400" fill="#fffdf7" text-anchor="middle">Kata</text>
      <path d="M-120 62 Q 0 34 120 62" fill="none" stroke="#c6edcf" stroke-width="1.6" opacity="0.8"/>
      <text x="0" y="104" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="12" font-weight="700" fill="#c6edcf" text-anchor="middle" letter-spacing="3">KUMPULAN CERPEN - 2026</text>
      <circle cx="0" cy="190" r="44" fill="none" stroke="#c6edcf" stroke-width="2"/>
      <circle cx="0.0" cy="175.1" r="12.5" fill="#c6edcf" stroke="#c6edcf" stroke-width="1.6"/><circle cx="14.2" cy="185.4" r="12.5" fill="#c6edcf" stroke="#c6edcf" stroke-width="1.6"/><circle cx="8.7" cy="202.0" r="12.5" fill="#c6edcf" stroke="#c6edcf" stroke-width="1.6"/><circle cx="-8.7" cy="202.0" r="12.5" fill="#c6edcf" stroke="#c6edcf" stroke-width="1.6"/><circle cx="-14.2" cy="185.4" r="12.5" fill="#c6edcf" stroke="#c6edcf" stroke-width="1.6"/><circle cx="0" cy="190" r="7.2" fill="#fffdf7" stroke="#c6edcf" stroke-width="1.6"/>
      <text x="0" y="266" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="700" fill="#c6edcf" text-anchor="middle" letter-spacing="2">FAEYZA PRINTING</text>
    </g>
  </g>

  <rect width="1200" height="900" filter="url(#grain)" opacity="0.7"/>

  <g>
    <rect x="64" y="826" width="42" height="3" rx="1.5" fill="#2b2723"/>
    <text x="64" y="856" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="14" font-weight="800" fill="#2b2723" letter-spacing="3">FAEYZA STUDIO</text>
    <text x="64" y="876" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#7d7566" letter-spacing="2.4">DIGITAL PRINTING - BANDUNG</text>
  </g>
  <g text-anchor="end">
    <text x="1136" y="846" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="800" fill="#7d7566" letter-spacing="2.4">BUKU DAN NOVEL SOFTCOVER</text>
    <text x="1136" y="868" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#9a9283" letter-spacing="2">SERI 02</text>
  </g>
</svg>
