      <text x="-210" y="-142" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="13" font-weight="800" fill="#43664e" letter-spacing="2">BAB I - PENGENALAN</text>
      <rect x="-210" y="-108" width="319.79999999999995" height="6" rx="3" fill="#2b2723" opacity="0.4"/><rect x="-210" y="-82" width="370.5" height="6" rx="3" fill="#2b2723" opacity="0.4"/><rect x="-210" y="-56" width="350.99999999999994" height="6" rx="3" fill="#2b2723" opacity="0.4"/><rect x="-210" y="-30" width="331.5" height="6" rx="3" fill="#2b2723" opacity="0.4"/><rect x="-210" y="-4" width="382.2" height="6" rx="3" fill="#2b2723" opacity="0.4"/><rect x="-210" y="22" width="362.7" height="6" rx="3" fill="#2b2723" opacity="0.4"/><rect x="-210" y="48" width="343.19999999999993" height="6" rx="3" fill="#2b2723" opacity="0.4"/><rect x="-210" y="74" width="323.7" height="6" rx="3" fill="#2b2723" opacity="0.4"/><rect x="-210" y="100" width="374.4" height="6" rx="3" fill="#2b2723" opacity="0.4"/><rect x="-210" y="126" width="241.8" height="6" rx="3" fill="#2b2723" opacity="0.4"/>
