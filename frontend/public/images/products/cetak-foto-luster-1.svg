<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Cetak Foto Luster dan Silky - Faeyza Digital Printing Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf9f0"/>
      <stop offset="0.55" stop-color="#f8f2e6"/>
      <stop offset="1" stop-color="#f3ebdc"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe5d3" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8dcc7" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#8a6a52" flood-opacity="0.16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2b2723" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect y="640" width="1200" height="260" fill="url(#floor)"/>
  <circle cx="1032" cy="112" r="236" fill="#fbe38d" opacity="0.42"/>
  <circle cx="1064" cy="146" r="304" fill="none" stroke="#2b2723" stroke-width="1.6" opacity="0.1"/>
  <circle cx="84" cy="824" r="228" fill="#c6edcf" opacity="0.34"/>
  <rect x="36" y="40" width="220" height="130" fill="url(#dots)"/>

  
  <ellipse cx="600" cy="728" rx="330" ry="28" fill="#8a6a52" opacity="0.16"/>
  <g transform="translate(600 446) rotate(-2)">
    <rect x="-300" y="-320" width="330" height="610" rx="6" fill="#fffdf7" stroke="#2b2723" stroke-width="3" transform="translate(-58 22) rotate(-4)" filter="url(#soft)"/>
    <rect x="-274" y="-294" width="278" height="558" fill="#fed9e1" opacity="0.55"/>
    <g>
      <rect x="-238" y="-300" width="470" height="620" rx="10" fill="#c6edcf" stroke="#2b2723" stroke-width="3"/>
      <rect x="-214" y="-276" width="422" height="572" fill="#cfe4ee" stroke="#2b2723" stroke-width="2"/>
      <circle cx="0" cy="-106" r="68" fill="#fbe38d" opacity="0.9"/>
      <path d="M-214 120 Q -120 20 -10 92 Q 90 160 208 46 L 208 296 L -214 296 Z" fill="#c6edcf" stroke="#2b2723" stroke-width="2"/>
      <path d="M-214 190 Q -100 110 10 172 Q 110 226 208 140" fill="none" stroke="#6e5d15" stroke-width="2" opacity="0.5"/>
      <text x="0" y="250" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="12" font-weight="800" fill="#6e5d15" text-anchor="middle" letter-spacing="3">LUSTER PREMIUM - A3</text>
    </g>
  </g>

  <rect width="1200" height="900" filter="url(#grain)" opacity="0.7"/>

  <g>
    <rect x="64" y="826" width="42" height="3" rx="1.5" fill="#2b2723"/>
    <text x="64" y="856" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="14" font-weight="800" fill="#2b2723" letter-spacing="3">FAEYZA STUDIO</text>
    <text x="64" y="876" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#7d7566" letter-spacing="2.4">DIGITAL PRINTING - BANDUNG</text>
  </g>
  <g text-anchor="end">
    <text x="1136" y="846" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="800" fill="#7d7566" letter-spacing="2.4">CETAK FOTO LUSTER DAN SILKY</text>
    <text x="1136" y="868" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#9a9283" letter-spacing="2">SERI 01</text>
  </g>
</svg>
