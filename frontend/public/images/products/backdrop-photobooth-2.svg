<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Event Backdrop dan Photobooth - Faeyza Digital Printing Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf9f0"/>
      <stop offset="0.55" stop-color="#f8f2e6"/>
      <stop offset="1" stop-color="#f3ebdc"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe5d3" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8dcc7" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#8a6a52" flood-opacity="0.16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2b2723" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect y="640" width="1200" height="260" fill="url(#floor)"/>
  <circle cx="1032" cy="112" r="236" fill="#c6edcf" opacity="0.42"/>
  <circle cx="1064" cy="146" r="304" fill="none" stroke="#2b2723" stroke-width="1.6" opacity="0.1"/>
  <circle cx="84" cy="824" r="228" fill="#fbe38d" opacity="0.34"/>
  <rect x="36" y="40" width="220" height="130" fill="url(#dots)"/>

  
  <ellipse cx="600" cy="726" rx="410" ry="26" fill="#8a6a52" opacity="0.16"/>
  <g transform="translate(600 430)">
    <rect x="-400" y="-290" width="800" height="540" rx="6" fill="#c6edcf" stroke="#2b2723" stroke-width="3" filter="url(#soft)"/>
    <rect x="-374" y="-264" width="748" height="488" fill="none" stroke="#2b2723" stroke-width="1.4" opacity="0.35"/>
    <circle cx="-230" cy="-120" r="108" fill="#b2dfee" stroke="#2b2723" stroke-width="2.5"/>
    <circle cx="-230.0" cy="-160.9" r="34.3" fill="#fffdf7" stroke="#2b2723" stroke-width="2.5"/><circle cx="-191.1" cy="-132.6" r="34.3" fill="#fffdf7" stroke="#2b2723" stroke-width="2.5"/><circle cx="-205.9" cy="-86.9" r="34.3" fill="#fffdf7" stroke="#2b2723" stroke-width="2.5"/><circle cx="-254.1" cy="-86.9" r="34.3" fill="#fffdf7" stroke="#2b2723" stroke-width="2.5"/><circle cx="-268.9" cy="-132.6" r="34.3" fill="#fffdf7" stroke="#2b2723" stroke-width="2.5"/><circle cx="-230" cy="-120" r="19.8" fill="#fffdf7" stroke="#2b2723" stroke-width="2.5"/>
    <circle cx="238" cy="-128" r="94" fill="#fbe38d" stroke="#2b2723" stroke-width="2.5"/>
    <path d="M238.0,-182.0 L252.0,-147.2 L289.4,-144.7 L260.6,-120.7 L269.7,-84.3 L238.0,-104.2 L206.3,-84.3 L215.4,-120.7 L186.6,-144.7 L224.0,-147.2 Z" fill="#fffdf7" stroke="#2b2723" stroke-width="2"/>
    <text x="0" y="-22" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="78" font-weight="800" fill="#43664e" text-anchor="middle" letter-spacing="4">PHOTOBOOTH</text>
    <text x="0" y="28" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="16" font-weight="800" fill="#43664e" text-anchor="middle" letter-spacing="4">EVENT BACKDROP - CUSTOM SIZE</text>
    <rect x="-170" y="70" width="340" height="1.6" fill="#43664e" opacity="0.5"/>
    <text x="0" y="114" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="12" font-weight="700" fill="#6d6556" text-anchor="middle" letter-spacing="3">HEAT WELDING - ANTI BLITZ MATTE</text>
    <text x="0" y="190" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="700" fill="#8f8675" text-anchor="middle" letter-spacing="2">FAEYZA DIGITAL PRINTING STUDIO</text>
    <circle cx="-386" cy="-276" r="8" fill="#fffdf7" stroke="#2b2723" stroke-width="2"/>
    <circle cx="386" cy="-276" r="8" fill="#fffdf7" stroke="#2b2723" stroke-width="2"/>
    <circle cx="-386" cy="236" r="8" fill="#fffdf7" stroke="#2b2723" stroke-width="2"/>
    <circle cx="386" cy="236" r="8" fill="#fffdf7" stroke="#2b2723" stroke-width="2"/>
  </g>

  <rect width="1200" height="900" filter="url(#grain)" opacity="0.7"/>

  <g>
    <rect x="64" y="826" width="42" height="3" rx="1.5" fill="#2b2723"/>
    <text x="64" y="856" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="14" font-weight="800" fill="#2b2723" letter-spacing="3">FAEYZA STUDIO</text>
    <text x="64" y="876" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#7d7566" letter-spacing="2.4">DIGITAL PRINTING - BANDUNG</text>
  </g>
  <g text-anchor="end">
    <text x="1136" y="846" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="800" fill="#7d7566" letter-spacing="2.4">EVENT BACKDROP DAN PHOTOBOOTH</text>
    <text x="1136" y="868" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#9a9283" letter-spacing="2">SERI 02</text>
