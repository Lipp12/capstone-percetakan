<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Kartu Ucapan dan Greeting Card - Faeyza Digital Printing Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf9f0"/>
      <stop offset="0.55" stop-color="#f8f2e6"/>
      <stop offset="1" stop-color="#f3ebdc"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe5d3" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8dcc7" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#8a6a52" flood-opacity="0.16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2b2723" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect y="640" width="1200" height="260" fill="url(#floor)"/>
  <circle cx="1032" cy="112" r="236" fill="#fed9e1" opacity="0.42"/>
  <circle cx="1064" cy="146" r="304" fill="none" stroke="#2b2723" stroke-width="1.6" opacity="0.1"/>
  <circle cx="84" cy="824" r="228" fill="#b2dfee" opacity="0.34"/>
  <rect x="36" y="40" width="220" height="130" fill="url(#dots)"/>

  
  <ellipse cx="600" cy="716" rx="340" ry="30" fill="#8a6a52" opacity="0.16"/>
  <g transform="translate(600 452) rotate(-1)">
    <g transform="translate(-34 26) rotate(-5)">
      <rect x="-230" y="-230" width="450" height="440" rx="6" fill="#fbe38d" stroke="#2b2723" stroke-width="2"/>
      <path d="M-230 -230 L0 -80 L230 -230 L230 210 L-230 210 Z" fill="#fffdf7" stroke="#2b2723" stroke-width="2"/>
      <path d="M-230 210 L0 60 L230 210" fill="none" stroke="#2b2723" stroke-width="2" opacity="0.5"/>
    </g>
    <g filter="url(#soft)">
      <rect x="-220" y="-250" width="440" height="480" rx="6" fill="#fffdf7" stroke="#2b2723" stroke-width="3"/>
      <rect x="-196" y="-226" width="392" height="432" rx="3" fill="none" stroke="#72575e" stroke-width="1.2" opacity="0.5"/>
      <path d="M-120 -160 Q 0 -230 120 -160" fill="none" stroke="#72575e" stroke-width="1.8"/>
      <text x="0" y="-120" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="800" fill="#72575e" text-anchor="middle" letter-spacing="5">THANK YOU</text>
      <text x="0" y="-46" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#72575e" text-anchor="middle">With</text>
      <text x="0" y="18" font-family="Georgia,serif" font-size="50" font-weight="400" fill="#72575e" text-anchor="middle">Gratitude</text>
      <circle cx="0.0" cy="80.0" r="21.8" fill="#fed9e1" stroke="#2b2723" stroke-width="2.5"/><circle cx="24.8" cy="98.0" r="21.8" fill="#fed9e1" stroke="#2b2723" stroke-width="2.5"/><circle cx="15.3" cy="127.1" r="21.8" fill="#fed9e1" stroke="#2b2723" stroke-width="2.5"/><circle cx="-15.3" cy="127.1" r="21.8" fill="#fed9e1" stroke="#2b2723" stroke-width="2.5"/><circle cx="-24.8" cy="98.0" r="21.8" fill="#fed9e1" stroke="#2b2723" stroke-width="2.5"/><circle cx="0" cy="106" r="12.6" fill="#fffdf7" stroke="#2b2723" stroke-width="2.5"/>
      <text x="0" y="194" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="700" fill="#8f8675" text-anchor="middle" letter-spacing="2">FAEYZA STUDIO - HANDMADE CARD</text>
    </g>
  </g>

  <rect width="1200" height="900" filter="url(#grain)" opacity="0.7"/>

  <g>
    <rect x="64" y="826" width="42" height="3" rx="1.5" fill="#2b2723"/>
    <text x="64" y="856" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="14" font-weight="800" fill="#2b2723" letter-spacing="3">FAEYZA STUDIO</text>
    <text x="64" y="876" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#7d7566" letter-spacing="2.4">DIGITAL PRINTING - BANDUNG</text>
  </g>
  <g text-anchor="end">
    <text x="1136" y="846" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="800" fill="#7d7566" letter-spacing="2.4">KARTU UCAPAN DAN GREETING CARD</text>
    <text x="1136" y="868" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#9a9283" letter-spacing="2">SERI 03</text>
  </g>
</svg>
