<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Tripod Banner 2 Sisi - Faeyza Digital Printing Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf9f0"/>
      <stop offset="0.55" stop-color="#f8f2e6"/>
      <stop offset="1" stop-color="#f3ebdc"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe5d3" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8dcc7" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#8a6a52" flood-opacity="0.16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2b2723" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect y="640" width="1200" height="260" fill="url(#floor)"/>
  <circle cx="1032" cy="112" r="236" fill="#fbe38d" opacity="0.42"/>
  <circle cx="1064" cy="146" r="304" fill="none" stroke="#2b2723" stroke-width="1.6" opacity="0.1"/>
  <circle cx="84" cy="824" r="228" fill="#c6edcf" opacity="0.34"/>
  <rect x="36" y="40" width="220" height="130" fill="url(#dots)"/>

  
  <ellipse cx="600" cy="734" rx="290" ry="24" fill="#8a6a52" opacity="0.18"/>
  <g transform="translate(600 430) rotate(-2)">
    <g stroke="#2b2723" stroke-width="10" stroke-linecap="round">
      <path d="M-40 300 L-190 460"/>
      <path d="M40 300 L190 460"/>
      <path d="M0 300 L0 460"/>
      <path d="M-150 260 L150 260"/>
    </g>
    <g filter="url(#soft)">
      <rect x="-176" y="-280" width="352" height="520" rx="10" fill="#c6edcf" stroke="#2b2723" stroke-width="3"/>
      <rect x="-152" y="-256" width="304" height="472" rx="6" fill="#fffdf7" stroke="#2b2723" stroke-width="2"/>
      <rect x="-152" y="-256" width="304" height="96" fill="#6e5d15"/>
      <text x="0" y="-212" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="24" font-weight="800" fill="#fffdf7" text-anchor="middle" letter-spacing="5">FAEYZA</text>
      <text x="0" y="-184" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="700" fill="#fbe38d" text-anchor="middle" letter-spacing="3">STUDIO DISPLAY</text>
      <circle cx="0" cy="-74" r="64" fill="#fed9e1" stroke="#2b2723" stroke-width="2.5"/>
      <path d="M0.0,-112.0 L9.8,-87.5 L36.1,-85.7 L15.9,-68.8 L22.3,-43.3 L0.0,-57.3 L-22.3,-43.3 L-15.9,-68.8 L-36.1,-85.7 L-9.8,-87.5 Z" fill="#fffdf7" stroke="#2b2723" stroke-width="2"/>
      <rect x="-116" y="24" width="190.23999999999998" height="6" rx="3" fill="#2b2723" opacity="0.42"/><rect x="-116" y="48" width="220.39999999999998" height="6" rx="3" fill="#2b2723" opacity="0.42"/><rect x="-116" y="72" width="208.79999999999998" height="6" rx="3" fill="#2b2723" opacity="0.42"/><rect x="-116" y="96" width="143.84" height="6" rx="3" fill="#2b2723" opacity="0.42"/>
      <rect x="-116" y="140" width="232" height="38" rx="19" fill="#6e5d15"/>
      <text x="0" y="165" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="800" fill="#fffdf7" text-anchor="middle" letter-spacing="2">TWO SIDED PRINT</text>
      <circle cx="0" cy="244" r="10" fill="#2b2723"/>
    </g>
  </g>

  <rect width="1200" height="900" filter="url(#grain)" opacity="0.7"/>

  <g>
    <rect x="64" y="826" width="42" height="3" rx="1.5" fill="#2b2723"/>
    <text x="64" y="856" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="14" font-weight="800" fill="#2b2723" letter-spacing="3">FAEYZA STUDIO</text>
    <text x="64" y="876" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#7d7566" letter-spacing="2.4">DIGITAL PRINTING - BANDUNG</text>
  </g>
  <g text-anchor="end">
    <text x="1136" y="846" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="800" fill="#7d7566" letter-spacing="2.4">TRIPOD BANNER 2 SISI</text>
    <text x="1136" y="868" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#9a9283" letter-spacing="2">SERI 01</text>
  </g>
</svg>
