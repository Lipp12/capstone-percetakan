      <g opacity="0.38"><rect x="-250" y="-292" width="500" height="46" fill="#ffd1e8"/><rect x="-250" y="-192" width="500" height="46" fill="#c9f2ff"/><rect x="-250" y="-92" width="500" height="46" fill="#fff3b0"/><rect x="-250" y="8" width="500" height="46" fill="#d6ffd9"/><rect x="-250" y="108" width="500" height="46" fill="#e3d1ff"/><rect x="-250" y="208" width="500" height="46" fill="#ffd8c9"/></g>
      <rect x="-252" y="-302" width="504" height="604" rx="10" fill="none" stroke="#2b2723" stroke-width="1.4" stroke-dasharray="7 8" opacity="0.4"/>
      <circle cx="-118" cy="-150" r="84" fill="#ffd1e8" stroke="#2b2723" stroke-width="2.5" stroke-dasharray="6 6"/>
      <circle cx="-118.0" cy="-182.2" r="27.0" fill="#c9f2ff" stroke="#2b2723" stroke-width="2.5"/><circle cx="-87.3" cy="-160.0" r="27.0" fill="#c9f2ff" stroke="#2b2723" stroke-width="2.5"/><circle cx="-99.0" cy="-123.9" r="27.0" fill="#c9f2ff" stroke="#2b2723" stroke-width="2.5"/><circle cx="-137.0" cy="-123.9" r="27.0" fill="#c9f2ff" stroke="#2b2723" stroke-width="2.5"/><circle cx="-148.7" cy="-160.0" r="27.0" fill="#c9f2ff" stroke="#2b2723" stroke-width="2.5"/><circle cx="-118" cy="-150" r="15.6" fill="#fffdf7" stroke="#2b2723" stroke-width="2.5"/>
      <rect x="34" y="-228" width="184" height="140" rx="22" fill="#fff3b0" stroke="#2b2723" stroke-width="2.5" stroke-dasharray="6 6"/>
      <text x="126" y="-142" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="34" font-weight="800" fill="#72575e" text-anchor="middle" letter-spacing="2">HOLO</text>
