      <text x="148" y="22"  font-size="56" font-weight="800" fill="#2b2723" text-anchor="middle" font-family="Georgia,serif">F</text>
      <rect x="-234" y="20" width="292" height="108" rx="54" fill="#ffd1e8" stroke="#2b2723" stroke-width="2.5" stroke-dasharray="6 6"/>
      <text x="-88" y="66" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="17" font-weight="800" fill="#2b2723" text-anchor="middle" letter-spacing="2">PRISM</text>
      <text x="-88" y="94" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="17" font-weight="800" fill="#2b2723" text-anchor="middle" letter-spacing="2">RAINBOW</text>
      <rect x="-164" y="170" width="168" height="50" rx="25" fill="#fffdf7" stroke="#2b2723" stroke-width="2"/>
      <text x="-80" y="201" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="12" font-weight="800" fill="#72575e" text-anchor="middle" letter-spacing="1.5">DIE CUT</text>
      <rect x="64" y="196" width="139.4" height="6" rx="3" fill="#2b2723" opacity="0.45"/><rect x="64" y="218" width="161.5" height="6" rx="3" fill="#2b2723" opacity="0.45"/><rect x="64" y="240" width="105.4" height="6" rx="3" fill="#2b2723" opacity="0.45"/>
      <path d="M280 250 L280 330 L200 330 Z" fill="#e8e0d1" stroke="#2b2723" stroke-width="2.5"/>
