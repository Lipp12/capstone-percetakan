<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Kaos Sablon DTF - Faeyza Digital Printing Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf9f0"/>
      <stop offset="0.55" stop-color="#f8f2e6"/>
      <stop offset="1" stop-color="#f3ebdc"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe5d3" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8dcc7" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#8a6a52" flood-opacity="0.16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2b2723" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect y="640" width="1200" height="260" fill="url(#floor)"/>
  <circle cx="1032" cy="112" r="236" fill="#c6edcf" opacity="0.42"/>
  <circle cx="1064" cy="146" r="304" fill="none" stroke="#2b2723" stroke-width="1.6" opacity="0.1"/>
  <circle cx="84" cy="824" r="228" fill="#fbe38d" opacity="0.34"/>
  <rect x="36" y="40" width="220" height="130" fill="url(#dots)"/>

  
  <ellipse cx="600" cy="728" rx="300" ry="30" fill="#8a6a52" opacity="0.16"/>
  <g transform="translate(600 446) rotate(2)">
    <path d="M-170 -240 L-260 -150 L-198 -86 L-150 -134 L-150 280 L150 280 L150 -134 L198 -86 L260 -150 L170 -240 L90 -268 Q 0 -220 -90 -268 Z" fill="#b2dfee" stroke="#2b2723" stroke-width="3.5" filter="url(#soft)"/>
    <path d="M-90 -268 Q 0 -214 90 -268" fill="none" stroke="#2b2723" stroke-width="2.5"/>
    <path d="M-150 280 L150 280" stroke="#2b2723" stroke-width="1.6" stroke-dasharray="6 6" opacity="0.35"/>
    <circle cx="0" cy="-22" r="94" fill="#c6edcf" stroke="#2b2723" stroke-width="2.5"/>
    <path d="M0.0,-80.0 L15.0,-42.6 L55.2,-39.9 L24.3,-14.1 L34.1,24.9 L0.0,3.5 L-34.1,24.9 L-24.3,-14.1 L-55.2,-39.9 L-15.0,-42.6 Z" fill="#fffdf7" stroke="#2b2723" stroke-width="2"/>
    <text x="0" y="116" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="34" font-weight="800" fill="#43664e" text-anchor="middle" letter-spacing="6">FAEYZA</text>
    <text x="0" y="146" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="10" font-weight="800" fill="#43664e" text-anchor="middle" letter-spacing="2">DTF FULL COLOR - COTTON COMBED</text>
    <path d="M-116 188 Q 0 162 116 188" fill="none" stroke="#43664e" stroke-width="1.6" opacity="0.4"/>
  </g>

  <rect width="1200" height="900" filter="url(#grain)" opacity="0.7"/>

  <g>
    <rect x="64" y="826" width="42" height="3" rx="1.5" fill="#2b2723"/>
    <text x="64" y="856" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="14" font-weight="800" fill="#2b2723" letter-spacing="3">FAEYZA STUDIO</text>
    <text x="64" y="876" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#7d7566" letter-spacing="2.4">DIGITAL PRINTING - BANDUNG</text>
  </g>
  <g text-anchor="end">
    <text x="1136" y="846" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="800" fill="#7d7566" letter-spacing="2.4">KAOS SABLON DTF</text>
    <text x="1136" y="868" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#9a9283" letter-spacing="2">SERI 02</text>
  </g>
</svg>
