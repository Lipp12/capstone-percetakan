<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Poster Albatros Format Lebar - Faeyza Digital Printing Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf9f0"/>
      <stop offset="0.55" stop-color="#f8f2e6"/>
      <stop offset="1" stop-color="#f3ebdc"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe5d3" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8dcc7" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#8a6a52" flood-opacity="0.16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2b2723" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect y="640" width="1200" height="260" fill="url(#floor)"/>
  <circle cx="1032" cy="112" r="236" fill="#fbe38d" opacity="0.42"/>
  <circle cx="1064" cy="146" r="304" fill="none" stroke="#2b2723" stroke-width="1.6" opacity="0.1"/>
  <circle cx="84" cy="824" r="228" fill="#c6edcf" opacity="0.34"/>
  <rect x="36" y="40" width="220" height="130" fill="url(#dots)"/>

  
  <ellipse cx="600" cy="728" rx="390" ry="28" fill="#8a6a52" opacity="0.16"/>
  <g transform="translate(600 444) rotate(-3)">
    <rect x="-360" y="-300" width="720" height="560" rx="6" fill="#fffdf7" stroke="#2b2723" stroke-width="3" transform="translate(28 20) rotate(3)"/>
    <g filter="url(#soft)">
      <rect x="-386" y="-310" width="760" height="580" rx="4" fill="#fbe38d" stroke="#2b2723" stroke-width="3"/>
      <rect x="-362" y="-286" width="712" height="532" fill="#c6edcf" opacity="0.55"/>
      <circle cx="-160" cy="-88" r="104" fill="#fed9e1" stroke="#2b2723" stroke-width="2.5"/>
      <circle cx="-160.0" cy="-127.7" r="33.3" fill="#fffdf7" stroke="#2b2723" stroke-width="2.5"/><circle cx="-122.3" cy="-100.3" r="33.3" fill="#fffdf7" stroke="#2b2723" stroke-width="2.5"/><circle cx="-136.7" cy="-55.9" r="33.3" fill="#fffdf7" stroke="#2b2723" stroke-width="2.5"/><circle cx="-183.3" cy="-55.9" r="33.3" fill="#fffdf7" stroke="#2b2723" stroke-width="2.5"/><circle cx="-197.7" cy="-100.3" r="33.3" fill="#fffdf7" stroke="#2b2723" stroke-width="2.5"/><circle cx="-160" cy="-88" r="19.2" fill="#fffdf7" stroke="#2b2723" stroke-width="2.5"/>
      <text x="-160" y="92" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="44" font-weight="800" fill="#6e5d15" text-anchor="middle">WIDE</text>
      <text x="-160" y="138" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="44" font-weight="800" fill="#6e5d15" text-anchor="middle">DISPLAY</text>
      <rect x="46" y="-226" width="250" height="400" fill="#fffdf7" stroke="#2b2723" stroke-width="2"/>
      <rect x="74" y="-190" width="159.07999999999998" height="7" rx="3.5" fill="#2b2723" opacity="0.4"/><rect x="74" y="-160" width="184.29999999999998" height="7" rx="3.5" fill="#2b2723" opacity="0.4"/><rect x="74" y="-130" width="174.6" height="7" rx="3.5" fill="#2b2723" opacity="0.4"/><rect x="74" y="-100" width="164.9" height="7" rx="3.5" fill="#2b2723" opacity="0.4"/><rect x="74" y="-70" width="120.28" height="7" rx="3.5" fill="#2b2723" opacity="0.4"/>
      <text x="74" y="88" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="13" font-weight="800" fill="#6e5d15" letter-spacing="2">ALBATROS MATTE</text>
      <text x="74" y="120" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="700" fill="#6d6556" letter-spacing="1.5">ANTI-SILAU BLITZ - 3 x 2 m</text>
      <text x="-362" y="262" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="700" fill="#6e5d15" letter-spacing="2">FAEYZA STUDIO - PRINTED IN HIGH RESOLUTION</text>
    </g>
  </g>

  <rect width="1200" height="900" filter="url(#grain)" opacity="0.7"/>

  <g>
    <rect x="64" y="826" width="42" height="3" rx="1.5" fill="#2b2723"/>
    <text x="64" y="856" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="14" font-weight="800" fill="#2b2723" letter-spacing="3">FAEYZA STUDIO</text>
    <text x="64" y="876" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#7d7566" letter-spacing="2.4">DIGITAL PRINTING - BANDUNG</text>
  </g>
  <g text-anchor="end">
    <text x="1136" y="846" font-family="'Epilogue','Trebuchet MS',sans-serif" font-size="11" font-weight="800" fill="#7d7566" letter-spacing="2.4">POSTER ALBATROS FORMAT LEBAR</text>
    <text x="1136" y="868" font-family="'Plus Jakarta Sans','Trebuchet MS',sans-serif" font-size="10" font-weight="700" fill="#9a9283" letter-spacing="2">SERI 01</text>
  </g>
</svg>
