          <rect x="-192" y="-254" width="388" height="538" fill="#fbe38d" opacity="0.5"/>
          <path d="M-60 190 L-60 -40 Q -60 -150 0 -150 Q 60 -150 60 -40 L60 190 Z" fill="#c6edcf" stroke="#2b2723" stroke-width="2.5"/>
