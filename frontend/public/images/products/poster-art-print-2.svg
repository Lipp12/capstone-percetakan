        <rect x="-274" y="-294" width="278" height="558" fill="#b2dfee" opacity="0.55"/>
        <g>
          <rect x="-238" y="-300" width="480" height="630" rx="6" fill="#b5854f" stroke="#2b2723" stroke-width="3"/>
