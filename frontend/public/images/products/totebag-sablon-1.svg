        <path d="M-212 -204 L-256 268 M212 -204 L256 268" stroke="#2b2723" stroke-width="2" opacity="0.25"/>
        <path d="M-232 -160 L232 -160" stroke="#2b2723" stroke-width="1.6" stroke-dasharray="6 6" opacity="0.4"/>
